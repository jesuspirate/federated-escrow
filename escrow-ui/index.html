<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>SatoshiMarket — Bitcoin Marketplace & P2P Exchange</title>
    <meta name="description" content="Buy, sell, lend, and trade with Bitcoin — powered by Fedi e-cash and 2-of-3 escrow. No KYC. No middlemen. Community-powered." />
    <meta name="theme-color" content="#0c0f17" />
    <meta property="og:title" content="SatoshiMarket" />
    <meta property="og:description" content="Bitcoin-native marketplace, P2P exchange, and community lending — powered by Fedi e-cash and 2-of-3 escrow." />
    <meta property="og:image" content="/satoshimarket-logo.png" />
    <meta property="og:type" content="website" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  <script>
(function(){
  var h = location.hostname;
  var sub = h.startsWith("escrow.") ? "escrow" : h.startsWith("p2p.") ? "p2p" : h.startsWith("market.") ? "market" : h.startsWith("lending.") ? "lending" : "";
  var titles = { escrow: "⚖️ Escrow — SatoshiMarket", p2p: "₿ P2P Exchange — SatoshiMarket", market: "🛒 Marketplace — SatoshiMarket", lending: "🤝 Lending — SatoshiMarket" };
  if (sub && titles[sub]) { document.title = titles[sub]; }
  if (sub) {
    var link = document.querySelector("link[rel='icon']") || document.createElement("link");
    link.rel = "icon"; link.type = "image/svg+xml"; link.href = "/favicon-" + sub + ".svg";
    document.head.appendChild(link);
    var apple = document.querySelector("link[rel='apple-touch-icon']");
    if (apple) apple.href = "/favicon-" + sub + ".png";
  } else {
    var link = document.querySelector("link[rel='icon']") || document.createElement("link");
    link.rel = "icon"; link.type = "image/svg+xml"; link.href = "/favicon-main.svg";
    document.head.appendChild(link);
  }
})();
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
